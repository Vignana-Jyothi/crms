name: CI/CD Pipeline (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Build & Deploy Dev Environment
    # Use the self-hosted runner requested by the user for the dev environment
    runs-on: dev-ai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Because it's a self-hosted runner, we assume Docker is already installed.
      # We just bring up the full stack using docker-compose.
      - name: Deploy with Docker Compose
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          VITE_API_BASE_URL: ${{ secrets.DEV_VITE_API_BASE_URL }}
        run: |
          # Bring down any old containers, rebuild the images, and start the new ones
          docker compose down
          
          # Clean up stopped containers and unused networks to prevent "all predefined address pools have been fully subnetted" error
          # Note: We do NOT use --volumes here to avoid wiping out the database data
          docker system prune -f
          
          # Export custom ports for the dev environment
          export BACKEND_PORT=6565
          export MAIN_FRONTEND_PORT=3535
          export ADMIN_FRONTEND_PORT=3536
          
          docker compose up -d --build
