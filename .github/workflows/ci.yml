name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    # Use the self-hosted runner explicitly requested by the user
    runs-on: gamma

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Because it's a self-hosted runner, we assume Docker is already installed.
      # We just bring up the full stack using docker-compose.
      - name: Deploy with Docker Compose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          # Write environment variables to .env files so docker-compose can use them
          echo "DATABASE_URL=$DATABASE_URL" > crms-backend/.env.docker
          echo "JWT_ACCESS_SECRET=$JWT_SECRET" >> crms-backend/.env.docker
          echo "JWT_REFRESH_SECRET=$JWT_SECRET" >> crms-backend/.env.docker
          # Bring down any old containers, rebuild the images, and start the new ones
          docker compose down
          
          # Clean up stopped containers and unused networks to prevent "all predefined address pools have been fully subnetted" error
          # Note: We do NOT use --volumes here to avoid wiping out the database data
          docker system prune -f
          
          docker compose up -d --build
