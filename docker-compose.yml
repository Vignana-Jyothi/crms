services:
  db:
    image: postgres:15-alpine
    container_name: crms-db
    restart: unless-stopped
    env_file:
      - ./crms-backend/.env.docker
    ports:
      - "${POSTGRES_PORT:-5466}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  crms-backend:
    build:
      context: ./crms-backend
      dockerfile: Dockerfile
    container_name: crms-backend
    restart: unless-stopped
    env_file:
      - ./crms-backend/.env.docker
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  crms-main-frontend:
    build:
      context: ./crms-main-frontend
      dockerfile: Dockerfile
    container_name: crms-main-frontend
    restart: unless-stopped
    ports:
      - "18432:80"
    depends_on:
      - crms-backend

  crms-admin-frontend:
    build:
      context: ./crms-admin-frontend
      dockerfile: Dockerfile
    container_name: crms-admin-frontend
    restart: unless-stopped
    ports:
      - "18433:80"
    depends_on:
      - crms-backend

volumes:
  postgres_data:
