version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crms-db
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crms@123
      POSTGRES_DB: crms
    volumes:
      - postgres_data:/var/lib/postgresql/data

  crms-backend:
    build: 
      context: ./crms-backend
      dockerfile: Dockerfile
    container_name: crms-backend
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "4000:4000"
    env_file:
      - ./crms-backend/.env
    # Add extra hosts if you are running PostgreSQL on the host machine of the runner
    extra_hosts:
      - "host.docker.internal:host-gateway"

  crms-main-frontend:
    build:
      context: ./crms-main-frontend
      dockerfile: Dockerfile
      # Passing the API URL into the frontend build phase
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:4000}
    container_name: crms-main-frontend
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "18432:80"
    depends_on:
      - crms-backend

volumes:
  postgres_data:
