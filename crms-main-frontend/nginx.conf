server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any unmatched path falls back to index.html so
    # React Router handles it client-side, instead of nginx 404ing
    # on a direct visit to e.g. /resources/RM-0001.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
