# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=150r/s;

# Upstream connection pool to maintain persistent keepalive connections with Node.js
upstream backend_cluster {
    server crms-backend:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Gzip Compression (reduces transfer sizes by up to 70%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # 2. Security Headers & Google Sign-In Popup Support
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 3. API Proxy with Rate Limiting & Keepalive
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for timetable OCR and large report uploads
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 4. Static Asset Caching (Browsers cache JS, CSS, images for 30 days)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 5. SPA Route Fallback (React Router handles navigation)
    location / {
        limit_req zone=static_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
